name: Build Ad Hoc IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Install signing certificate and profile
        env:
          SIGNING_CERT_PEM: ${{ secrets.SIGNING_CERT_PEM }}
          SIGNING_KEY_PEM: ${{ secrets.SIGNING_KEY_PEM }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_CERT_PEM" > "$RUNNER_TEMP/cert.pem"
          printf '%s' "$SIGNING_KEY_PEM" > "$RUNNER_TEMP/key.pem"
          openssl pkcs12 -export -in "$RUNNER_TEMP/cert.pem" -inkey "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/signing.p12" -passout env:P12_PASSWORD -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security import "$RUNNER_TEMP/signing.p12" -k "$RUNNER_TEMP/build.keychain-db" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db" >/dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/build.keychain-db"
          python3 -c 'import base64,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"profile.mobileprovision").write_bytes(base64.b64decode(os.environ["BUILD_PROVISION_PROFILE_BASE64"]))'
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 scripts/prepare-ios-profile.py
      - name: Configure application signing
        env:
          SIGNING_METADATA: ${{ runner.temp }}/signing.json
        run: |
          gem install xcodeproj --no-document
          ruby scripts/configure-ios-signing.rb
      - name: Build signed iPad and iPhone IPA
        run: |
          set -o pipefail
          flutter build ipa --release --build-number "$((5000 + GITHUB_RUN_NUMBER))" --export-options-plist "$RUNNER_TEMP/ExportOptions.plist" 2>&1 | tee "$RUNNER_TEMP/flutter-build.log"
      - name: Verify package
        run: |
          mkdir -p "$RUNNER_TEMP/ipa-check"
          unzip -q build/ios/ipa/*.ipa -d "$RUNNER_TEMP/ipa-check"
          APP="$(find "$RUNNER_TEMP/ipa-check/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          codesign --verify --deep --strict "$APP"
          /usr/libexec/PlistBuddy -c 'Print UIDeviceFamily' "$APP/Info.plist"
          shasum -a 256 build/ios/ipa/*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: PersonalLive-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-logs
          path: |
            ${{ runner.temp }}/flutter-build.log
            /Users/runner/Library/Logs/CocoaPods
      - name: Remove temporary signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.pem" "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/signing.p12"
