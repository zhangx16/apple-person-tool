name: ExpressTools
options:
  xcodeVersion: "15.0"
  projectFormat: xcode15_0
  minimumXcodeGenVersion: "2.38.0"
  bundleIdPrefix: com.zhangx16
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
targets:
  ExpressTools:
    type: application
    platform: iOS
    sources: [ExpressTools]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhangx16.expresstools
        INFOPLIST_FILE: ExpressTools/Info.plist
        CODE_SIGN_ENTITLEMENTS: ExpressTools/ExpressTools.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
